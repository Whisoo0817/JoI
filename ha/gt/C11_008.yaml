kind: script
key: C11_008
script:
  alias: C11_008
  mode: single
  sequence:
  - variables:
      t1: '{{ states(''sensor.wine_cellar_temp_sensor_temperature'') }}'
  - delay:
      hours: 1
  - variables:
      t2: '{{ states(''sensor.wine_cellar_temp_sensor_temperature'') }}'
  - if:
    - condition: template
      value_template: '{{ ((t2 - t1) >= 2) }}'
    then:
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_room_speaker
      data:
        Text: The wine cellar temperature rose by at least 2 degrees.
