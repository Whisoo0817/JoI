kind: script
key: C05_020
script:
  alias: C05_020
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.bathroom_hum_humidity'')|float >= 85 and states(''sensor.bathroom_window_current_position'')|float
        == 0) }}'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.bathroom_light
      data:
        Brightness: 100
        Rate: 0
    - action: cover.open_cover
      target:
        entity_id:
        - cover.bathroom_window
