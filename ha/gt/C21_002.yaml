kind: script
key: C21_002
script:
  alias: C21_002
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (is_state(''binary_sensor.front_contact_sensor_contact_sensor_contact'',
        ''on'') and is_state(''binary_sensor.balcony_contact_sensor_contact'', ''on'')) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_camera
