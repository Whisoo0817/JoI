kind: script
key: C10_007
script:
  alias: C10_007
  mode: single
  sequence:
  - wait_template: '{{ (states(''sensor.office_ap_1_air_purifier_mode'') == ''sleep'' or states(''sensor.office_ap_2_air_purifier_mode'')
      == ''sleep'') }}'
  - delay:
      minutes: 10
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.office_light
    data:
      Brightness: 0
      Rate: 0
