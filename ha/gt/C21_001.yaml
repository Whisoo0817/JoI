kind: script
key: C21_001
script:
  alias: C21_001
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((not is_state(''binary_sensor.living_room_presence_sensor_presence'',
        ''on'')) or is_state(''binary_sensor.bedroom_presence_sensor_presence'', ''off''))
        }}'
    then:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.living_room_strip
