kind: script
key: C24_002
script:
  alias: C24_002
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.meeting_presence_presence'', ''on'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.meeting_presence_presence'', ''on''))
            }}'
        timeout:
          minutes: 2
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - repeat:
      count: 3
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.meeting_speaker
        data:
          Text: The meeting starts soon
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /1
