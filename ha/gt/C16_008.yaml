kind: automation
key: C16_008
automation:
  alias: C16_008
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.hall_motion_motion
      state: 'on'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.hall_light_1
        - light.hall_light_2
      data:
        Brightness: 100
        Rate: 0
