kind: automation
key: C17_010
automation:
  alias: C17_010
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions: []
  actions:
  - variables:
      temp: '{{ states(''sensor.inside_temperature_sensor_temperature'') }}'
  - if:
    - condition: template
      value_template: '{{ (temp >= 25) }}'
    then:
    - action: climate.turn_on
      target:
        entity_id:
        - climate.main_air_conditioner
        - climate.bedroom_air_conditioner
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.main_air_conditioner
        - climate.bedroom_air_conditioner
      data:
        Mode: cool
    else:
    - action: climate.turn_off
      target:
        entity_id:
        - climate.main_air_conditioner
        - climate.bedroom_air_conditioner
