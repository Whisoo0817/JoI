kind: script
key: C07_006
script:
  alias: C07_006
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.living_room_smoke_detector_smoke'', ''on'')
      or is_state(''binary_sensor.kitchen_smoke_detector_smoke'', ''on'')) }}'
  - action: siren.set_siren_mode
    target:
      entity_id:
      - siren.living_room_siren
      - siren.entrance_siren
    data:
      Mode: fire
