kind: script
key: C24_004
script:
  alias: C24_004
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.lobby_presence_presence'', ''off'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.lobby_presence_presence'', ''off''))
            }}'
        timeout:
          minutes: 1
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - repeat:
      count: 4
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.lobby_speaker
        data:
          Text: Is anyone there
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /15
