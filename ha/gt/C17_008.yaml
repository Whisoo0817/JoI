kind: automation
key: C17_008
automation:
  alias: C17_008
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.grp2_hum_1_humidity'')|float >= 50 and states(''sensor.grp2_hum_2_humidity'')|float
        >= 50) }}'
    then:
    - action: dehumidifier.set_dehumidifier_mode
      target:
        entity_id:
        - dehumidifier.dehum_1
        - dehumidifier.dehum_2
      data:
        Mode: refreshing
