kind: script
key: C08_015
script:
  alias: C08_015
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.lr_mb_button2'') == ''pushed'' and states(''sensor.lr_illum_brightness'')|float
        < 50) }}'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.lr_light_1
        - light.lr_light_2
      data:
        Brightness: 100
        Rate: 0
