kind: script
key: C24_003
script:
  alias: C24_003
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ states(''sensor.office_plug_power'')|float < 5 }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (states(''sensor.office_plug_power'')|float < 5) }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - repeat:
      count: 3
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.office_speaker
        data:
          Text: Device is idle
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /2
