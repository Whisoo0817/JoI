kind: script
key: C03_010
script:
  alias: C03_010
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: sensor.main_charger_charging_state
      state: fullyCharged
    then:
    - action: charger.turn_off
      target:
        entity_id:
        - charger.main_charger
        - charger.garage_charger
