kind: script
key: C12_014
script:
  alias: C12_014
  mode: single
  sequence:
  - wait_template: '{{ is_state(''binary_sensor.lobby_mot_motion'', ''on'') }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: camera.capture_image
        target:
          entity_id:
          - camera.lobby_cam
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /30
