kind: script
key: C07_025
script:
  alias: C07_025
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.server_room_air_quality_sensor_carbon_dioxide'')|float
      >= 5000 }}'
  - action: siren.set_siren_mode
    target:
      entity_id:
      - siren.siren_main
      - siren.siren_back
    data:
      Mode: emergency
