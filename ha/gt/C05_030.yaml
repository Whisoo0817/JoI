kind: script
key: C05_030
script:
  alias: C05_030
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (is_state(''binary_sensor.living_room_light_switch'', ''on'') and
        states(''sensor.living_room_light_sensor_brightness'')|float >= 50) }}'
    then:
    - action: cover.close_cover
      target:
        entity_id:
        - cover.living_room_blind
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.living_room_ac
      data:
        Mode: auto
