kind: script
key: C08_004
script:
  alias: C08_004
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.lr_mb_button4'') == ''pushed'' }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.lr_light_1
      - light.lr_light_2
    data:
      Brightness: 100
      Rate: 0
