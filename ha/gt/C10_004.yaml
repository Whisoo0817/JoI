kind: script
key: C10_004
script:
  alias: C10_004
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.home_weather_provider_weather'') == ''rain'' }}'
  - action: cover.close_cover
    target:
      entity_id:
      - cover.back_window
  - delay:
      hours: 1
  - if:
    - condition: template
      value_template: '{{ states(''sensor.home_weather_provider_weather'') != ''rain'' }}'
    then:
    - action: cover.open_cover
      target:
        entity_id:
        - cover.back_window
