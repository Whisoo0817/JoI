kind: script
key: C05_004
script:
  alias: C05_004
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((states(''sensor.living_room_temperature_sensor_temperature'')|float
        >= 28 or states(''sensor.bedroom_temperature_sensor_temperature'')|float >= 28) and
        (states(''sensor.living_room_humidity_sensor_humidity'')|float >= 70 or states(''sensor.bedroom_humidity_sensor_humidity'')|float
        >= 70)) }}'
    then:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.living_room_air_conditioner
        - climate.bedroom_air_conditioner
      data:
        Mode: cool
    - action: climate.set_target_temperature
      target:
        entity_id:
        - climate.living_room_air_conditioner
        - climate.bedroom_air_conditioner
      data:
        Temperature: 24
