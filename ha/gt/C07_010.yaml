kind: script
key: C07_010
script:
  alias: C07_010
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.kitchen_leak_sensor_leakage'', ''on'') or
      is_state(''binary_sensor.bathroom_leak_sensor_leakage'', ''on'')) }}'
  - action: valve.close_valve
    target:
      entity_id:
      - valve.kitchen_valve
      - valve.bathroom_valve
