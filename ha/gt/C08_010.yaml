kind: script
key: C08_010
script:
  alias: C08_010
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.lr_mb_button2'') == ''pushed'' }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.lr_light_1
      - light.lr_light_2
    data:
      Brightness: 100
      Rate: 0
  - delay:
      minutes: 30
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.lr_light_1
      - light.lr_light_2
    data:
      Brightness: 30
      Rate: 0
