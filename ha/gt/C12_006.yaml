kind: script
key: C12_006
script:
  alias: C12_006
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.main_charger_voltage'')|float <= 4000 }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.living_speaker
          - media_player.bedroom_speaker
        data:
          Text: The charging voltage is low
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /30
