kind: script
key: C12_012
script:
  alias: C12_012
  mode: single
  sequence:
  - wait_template: '{{ is_state(''binary_sensor.lr_smoke_smoke'', ''on'') }}'
  - action: siren.set_siren_mode
    target:
      entity_id:
      - siren.lr_siren
    data:
      Mode: fire
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.speaker
          - media_player.bedroom_speaker
        data:
          Text: Please evacuate
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /10
