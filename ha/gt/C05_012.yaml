kind: script
key: C05_012
script:
  alias: C05_012
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((states(''sensor.living_sound_sound'')|float >= 80 or states(''sensor.entrance_sound_sound'')|float
        >= 80) and (is_state(''binary_sensor.living_presence_presence'', ''off'') and is_state(''binary_sensor.bedroom_presence_presence'',
        ''off''))) }}'
    then:
    - action: media_player.stop
      target:
        entity_id:
        - media_player.living_speaker
        - media_player.bedroom_speaker
    - action: siren.set_siren_mode
      target:
        entity_id:
        - siren.main_siren
        - siren.entrance_siren
      data:
        Mode: emergency
