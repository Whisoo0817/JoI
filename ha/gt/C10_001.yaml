kind: script
key: C10_001
script:
  alias: C10_001
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.entrance_presence_sensor_presence'', ''on'')
      or is_state(''binary_sensor.hallway_presence_sensor_presence'', ''on'')) }}'
  - delay:
      minutes: 1
  - action: camera.capture_image
    target:
      entity_id:
      - camera.entrance_camera
      - camera.living_room_camera
