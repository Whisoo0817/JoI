kind: script
key: C07_020
script:
  alias: C07_020
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.laundry_room_fan_speed'')|float <= 5 }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
    data:
      Text: The fan has slowed down
