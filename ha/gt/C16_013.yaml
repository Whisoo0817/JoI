kind: automation
key: C16_013
automation:
  alias: C16_013
  mode: single
  triggers:
  - trigger: time
    at: '22:00:00'
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: sensor.mr_lock_door_lock_state
      state: open
    then:
    - action: lock.lock
      target:
        entity_id:
        - lock.mr_lock
    - action: light.turn_off
      target:
        entity_id:
        - light.mr_light
