kind: script
key: C03_003
script:
  alias: C03_003
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: sensor.living_ac_air_conditioner_mode
      state: cool
    then:
    - action: climate.set_target_temperature
      target:
        entity_id:
        - climate.living_ac
      data:
        Temperature: '{{ states(''sensor.living_ac_target_temperature'') }} - 2'
