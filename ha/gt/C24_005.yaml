kind: script
key: C24_005
script:
  alias: C24_005
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.safe_contact_sensor_contact'', ''on'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.safe_contact_sensor_contact'',
            ''on'')) }}'
        timeout:
          seconds: 30
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - repeat:
      count: 5
      sequence:
      - action: camera.capture_image
        target:
          entity_id:
          - camera.safe_camera
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /30
