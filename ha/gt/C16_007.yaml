kind: automation
key: C16_007
automation:
  alias: C16_007
  mode: single
  triggers:
  - trigger: time
    at: '22:00:00'
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.lr_presence_presence
      state: 'on'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.lr_light
        - light.kitchen_light
        - light.bedroom_light
      data:
        Brightness: 100
        Rate: 0
