kind: script
key: C07_022
script:
  alias: C07_022
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.bathroom_humidity_sensor_humidity'')|float > 70 }}'
  - action: dehumidifier.set_dehumidifier_mode
    target:
      entity_id:
      - dehumidifier.bathroom_dehumidifier
    data:
      Mode: freezeProtection
