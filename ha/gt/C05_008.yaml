kind: script
key: C05_008
script:
  alias: C05_008
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((states(''sensor.living_light_sensor_brightness'')|float <= 100
        or states(''sensor.bedroom_light_sensor_brightness'')|float <= 100) and (is_state(''binary_sensor.living_presence_presence'',
        ''on'') or is_state(''binary_sensor.bedroom_presence_presence'', ''on''))) }}'
    then:
    - action: media_player.volume_set
      target:
        entity_id:
        - media_player.living_speaker
        - media_player.bedroom_speaker
      data:
        Volume: 30
    - action: media_player.media_play
      target:
        entity_id:
        - media_player.living_speaker
        - media_player.bedroom_speaker
      data:
        MediaSource: relax.mp3
