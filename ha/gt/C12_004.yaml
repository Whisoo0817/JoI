kind: script
key: C12_004
script:
  alias: C12_004
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.basement_leak_leakage'', ''on'') or is_state(''binary_sensor.kitchen_leak_leakage'',
      ''on'')) }}'
  - action: valve.close_valve
    target:
      entity_id:
      - valve.main_valve
      - valve.garden_valve
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.living_speaker
          - media_player.bedroom_speaker
        data:
          Text: Leak detected. Please evacuate.
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /1
