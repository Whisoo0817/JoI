kind: script
key: C01_019
script:
  alias: C01_019
  mode: single
  sequence:
  - action: cloud_service_provider.chat_with_ai
    target:
      entity_id:
      - cloud_service_provider.system_cloud_service_provider
    data:
      Prompt: What is an LLM?
    response_variable: ChatWithAI
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: '{{ ChatWithAI }}'
