kind: script
key: C03_015
script:
  alias: C03_015
  mode: single
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.living_room_sound_sensor_sound
      above: 50
    then:
    - action: media_player.stop
      target:
        entity_id:
        - media_player.living_room_speaker
