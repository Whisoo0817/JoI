kind: script
key: C11_003
script:
  alias: C11_003
  mode: single
  sequence:
  - variables:
      t1: '{{ states(''sensor.bedroom_temp_sensor_temperature'') }}'
  - delay:
      minutes: 30
  - variables:
      t2: '{{ states(''sensor.bedroom_temp_sensor_temperature'') }}'
  - if:
    - condition: template
      value_template: '{{ ((t1 - t2) >= 3) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.bedroom_heater
