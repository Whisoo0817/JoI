kind: script
key: C03_024
script:
  alias: C03_024
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.s1_temp_1_temperature'')|float >= 35 and states(''sensor.s1_temp_2_temperature'')|float
        >= 35) }}'
    then:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.s1_ac_1
        - climate.s1_ac_2
      data:
        Mode: cool
