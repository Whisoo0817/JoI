kind: automation
key: C16_009
automation:
  alias: C16_009
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions: []
  actions:
  - repeat:
      while:
      - condition: time
        before: 05:00:00
      sequence:
      - if:
        - condition: template
          value_template: '{{ (is_state(''binary_sensor.front_contact_sensor_contact'', ''off'')
            or is_state(''binary_sensor.hallway_contact_sensor_contact'', ''off'') or is_state(''binary_sensor.basement_contact_sensor_contact'',
            ''off'')) }}'
        then:
        - action: light.move_to_level
          target:
            entity_id:
            - light.hallway_light_1
            - light.hallway_light_2
          data:
            Level: 50
            Rate: 0
      - wait_for_trigger:
        - trigger: time_pattern
          hours: /1
