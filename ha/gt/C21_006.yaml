kind: script
key: C21_006
script:
  alias: C21_006
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.living_room_light_sensor_brightness'')|float <=
        50 and states(''sensor.kitchen_light_sensor_brightness'')|float <= 50) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_mood_light
