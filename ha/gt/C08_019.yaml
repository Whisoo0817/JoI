kind: automation
key: C08_019
automation:
  alias: C08_019
  mode: single
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.home_weather_provider_weather'') != ''rain'' }}'
  conditions: []
  actions:
  - action: cover.open_cover
    target:
      entity_id:
      - cover.main_window
      - cover.bedroom_window
