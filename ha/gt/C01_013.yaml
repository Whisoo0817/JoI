kind: script
key: C01_013
script:
  alias: C01_013
  mode: single
  sequence:
  - variables:
      FineDustLevel: '{{ states(''sensor.living_room_air_quality_fine_dust_level'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The fine dust level is {{ FineDustLevel }}
