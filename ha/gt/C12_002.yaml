kind: script
key: C12_002
script:
  alias: C12_002
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.entrance_contact_contact'', ''on'') or is_state(''binary_sensor.garage_contact_contact'',
      ''on'')) }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: siren.set_siren_mode
        target:
          entity_id:
          - siren.main_siren
          - siren.entrance_siren
        data:
          Mode: police
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /10
