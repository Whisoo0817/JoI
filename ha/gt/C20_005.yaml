kind: script
key: C20_005
script:
  alias: C20_005
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.front_contact_sensor_contact_sensor_contact'',
          ''on'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.front_contact_sensor_contact_sensor_contact'',
            ''on'')) }}'
        timeout:
          minutes: 1
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.living_room_ac
