kind: script
key: C20_006
script:
  alias: C20_006
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.bedroom_motion_sensor_motion'', ''off'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.bedroom_motion_sensor_motion'',
            ''off'')) }}'
        timeout:
          minutes: 1
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.bedroom_floor_lamp
