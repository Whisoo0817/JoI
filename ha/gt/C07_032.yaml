kind: script
key: C07_032
script:
  alias: C07_032
  mode: single
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.p_aq_carbon_dioxide
      above: 900
    then:
    - action: fan.set_air_purifier_mode
      target:
        entity_id:
        - fan.p_ap
      data:
        Mode: high
