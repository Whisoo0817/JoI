kind: script
key: C05_022
script:
  alias: C05_022
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.garden_illum_brightness'')|float < 50 and is_state(''binary_sensor.terrace_light_switch'',
        ''off'')) }}'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.terrace_light
      data:
        Brightness: 100
        Rate: 0
    - action: media_player.speak
      target:
        entity_id:
        - media_player.garden_speaker
        - media_player.terrace_speaker
      data:
        Text: The terrace light has been turned on.
