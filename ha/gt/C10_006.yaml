kind: script
key: C10_006
script:
  alias: C10_006
  mode: single
  sequence:
  - wait_template: '{{ (states(''sensor.hallway_light_1_current_brightness'')|float > 0 or
      states(''sensor.hallway_light_2_current_brightness'')|float > 0) }}'
  - delay:
      minutes: 5
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.hallway_light_1
      - light.hallway_light_2
    data:
      Brightness: 0
      Rate: 0
