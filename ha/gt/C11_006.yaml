kind: script
key: C11_006
script:
  alias: C11_006
  mode: single
  sequence:
  - variables:
      t1: '{{ states(''sensor.living_room_light_sensor_brightness'') }}'
  - delay:
      hours: 1
  - variables:
      t2: '{{ states(''sensor.living_room_light_sensor_brightness'') }}'
  - if:
    - condition: template
      value_template: '{{ ((t1 - t2) >= 200) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_mood_light
