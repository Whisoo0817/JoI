kind: script
key: C03_005
script:
  alias: C03_005
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.main_weather_provider_pm25_weather'')|float >= 15
        }}'
    then:
    - action: siren.set_siren_mode
      target:
        entity_id:
        - siren.main_siren
        - siren.garage_siren
      data:
        Mode: emergency
