kind: script
key: C20_014
script:
  alias: C20_014
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.office_presence_presence'', ''off'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.office_presence_presence'', ''off''))
            }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.office_ac
