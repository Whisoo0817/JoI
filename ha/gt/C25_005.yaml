kind: automation
key: C25_005
automation:
  alias: C25_005
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: numeric_state
    entity_id: counter.c25_005_n
    below: 3
  actions:
  - variables:
      v: '{{ states(''sensor.living_room_temp_temperature'') }}'
  - if:
    - condition: template
      value_template: '{{ (v < 18) }}'
    then:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.living_room_ac
      data:
        Mode: heat
    else:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.living_room_ac
      data:
        Mode: auto
  - action: counter.increment
    target:
      entity_id: counter.c25_005_n
helpers:
  counter:
    c25_005_n:
      initial: 0
