kind: script
key: C01_008
script:
  alias: C01_008
  mode: single
  sequence:
  - variables:
      Temperature: '{{ states(''sensor.living_room_temp_temperature'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The indoor temperature is {{ Temperature }}
