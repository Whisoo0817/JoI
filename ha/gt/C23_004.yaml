kind: script
key: C23_004
script:
  alias: C23_004
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ states(''sensor.bedroom_temp_temperature'')|float > 28 }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (states(''sensor.bedroom_temp_temperature'')|float > 28)
            }}'
        timeout:
          minutes: 5
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.bedroom_fan
  - delay:
      minutes: 20
  - action: switch.turn_off
    target:
      entity_id:
      - switch.bedroom_fan
