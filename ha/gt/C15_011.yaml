kind: automation
key: C15_011
automation:
  alias: C15_011
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: template
    value_template: '{{ now().day == 25 and now().month == 12 }}'
  actions:
  - action: light.move_to_color
    target:
      entity_id:
      - light.living_light
      - light.bedroom_light
    data:
      ColorX: 0.675
      ColorY: 0.322
      TransitionTime: 0
