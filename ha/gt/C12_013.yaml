kind: script
key: C12_013
script:
  alias: C12_013
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.f1_pres_1_presence'', ''on'') or is_state(''binary_sensor.f1_pres_2_presence'',
      ''on'')) }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: siren.set_siren_mode
        target:
          entity_id:
          - siren.f1_siren
        data:
          Mode: emergency
      - delay:
          seconds: 3
      - action: siren.turn_off
        target:
          entity_id:
          - siren.f1_siren
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /1
