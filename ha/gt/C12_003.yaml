kind: script
key: C12_003
script:
  alias: C12_003
  mode: single
  sequence:
  - wait_template: '{{ is_state(''binary_sensor.entrance_contact_sensor_contact'', ''off'')
      }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''sensor.main_door_lock_door_lock_state'') != ''closed''
            }}'
        then:
        - action: media_player.speak
          target:
            entity_id:
            - media_player.living_speaker
            - media_player.bedroom_speaker
          data:
            Text: The safe is open
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /5
