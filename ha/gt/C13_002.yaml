kind: automation
key: C13_002
automation:
  alias: C13_002
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ ((states(''counter.c13_002_n'')|int % 2) == 0) }}'
    then:
    - action: fan.set_air_purifier_mode
      target:
        entity_id:
        - fan.living_room_air_purifier
      data:
        Mode: sleep
    else:
    - action: fan.set_air_purifier_mode
      target:
        entity_id:
        - fan.living_room_air_purifier
      data:
        Mode: auto
  - action: counter.increment
    target:
      entity_id: counter.c13_002_n
helpers:
  counter:
    c13_002_n:
      initial: 0
