kind: automation
key: C18_008
automation:
  alias: C18_008
  mode: single
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: time
    weekday:
    - sat
  actions:
  - repeat:
      while:
      - condition: not
        conditions:
        - condition: time
          weekday:
          - mon
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.main_pump_switch
          state: 'off'
        then:
        - action: pump.turn_on
          target:
            entity_id:
            - pump.main_pump
        else:
        - action: pump.turn_off
          target:
            entity_id:
            - pump.main_pump
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /5
