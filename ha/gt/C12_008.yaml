kind: script
key: C12_008
script:
  alias: C12_008
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.main_fan_speed'')|float == 0 }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.living_speaker
          - media_player.bedroom_speaker
        data:
          Text: Please check the fan
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /10
