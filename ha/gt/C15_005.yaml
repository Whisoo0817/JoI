kind: automation
key: C15_005
automation:
  alias: C15_005
  mode: single
  triggers:
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - repeat:
      while:
      - condition: time
        before: '24:00:00'
      sequence:
      - action: camera.capture_image
        target:
          entity_id:
          - camera.entrance_camera
          - camera.garage_camera
      - wait_for_trigger:
        - trigger: time_pattern
          hours: /1
