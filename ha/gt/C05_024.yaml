kind: script
key: C05_024
script:
  alias: C05_024
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.baby_room_sound_sound'')|float >= 50 and states(''sensor.living_room_speaker_playback_state'')
        == ''stopped'') }}'
    then:
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_room_speaker
      data:
        Text: the baby is awake
    - action: media_player.media_play
      target:
        entity_id:
        - media_player.living_room_speaker
      data:
        MediaSource: lullaby.mp3
