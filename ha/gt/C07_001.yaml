kind: script
key: C07_001
script:
  alias: C07_001
  mode: single
  sequence:
  - wait_template: '{{ is_state(''binary_sensor.entrance_contact_contact'', ''on'') }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.living_room_light
      - light.kitchen_light
    data:
      Brightness: 100
      Rate: 0
