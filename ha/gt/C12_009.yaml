kind: script
key: C12_009
script:
  alias: C12_009
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.entrance_motion_motion'', ''on'') or is_state(''binary_sensor.garage_motion_motion'',
      ''on'')) }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: camera.capture_image
        target:
          entity_id:
          - camera.entrance_camera
          - camera.garage_camera
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /10
