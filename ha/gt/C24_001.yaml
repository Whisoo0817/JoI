kind: script
key: C24_001
script:
  alias: C24_001
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.entrance_contact_sensor_contact'', ''off'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.entrance_contact_sensor_contact'',
            ''off'')) }}'
        timeout:
          minutes: 1
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - repeat:
      count: 3
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.hall_speaker
        data:
          Text: Please close the door
      - wait_for_trigger:
        - trigger: time_pattern
          seconds: /30
