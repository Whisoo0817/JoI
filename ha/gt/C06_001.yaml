kind: script
key: C06_001
script:
  alias: C06_001
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.living_room_temp_sensor_temperature'')|float >=
        28 or states(''sensor.bedroom_temp_sensor_temperature'')|float >= 30) }}'
    then:
    - action: climate.turn_on
      target:
        entity_id:
        - climate.living_room_ac
