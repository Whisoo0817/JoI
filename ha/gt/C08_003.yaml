kind: script
key: C08_003
script:
  alias: C08_003
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.lr_mb_button3'') == ''pushed'' }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.lr_light_1
      - light.lr_light_2
    data:
      Brightness: 30
      Rate: 0
