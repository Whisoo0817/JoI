kind: script
key: C05_002
script:
  alias: C05_002
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.bedroom_temp_temperature'')|float >= 26 and states(''sensor.bedroom_window_current_position'')|float
        > 0) }}'
    then:
    - action: cover.close_cover
      target:
        entity_id:
        - cover.bedroom_window
    - action: climate.turn_on
      target:
        entity_id:
        - climate.bedroom_ac
