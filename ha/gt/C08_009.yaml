kind: script
key: C08_009
script:
  alias: C08_009
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.entrance_mb_button1'') == ''pushed'' }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.entrance_light
    data:
      Brightness: 100
      Rate: 0
  - delay:
      minutes: 5
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.entrance_light
    data:
      Brightness: 0
      Rate: 0
