kind: script
key: C03_026
script:
  alias: C03_026
  mode: single
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.lr_light_sensor_brightness
      below: 50
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.lr_light
      data:
        Brightness: 100
        Rate: 0
