kind: script
key: C12_010
script:
  alias: C12_010
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.sr_humid_humidity'')|float > 70 }}'
  - action: dehumidifier.set_dehumidifier_mode
    target:
      entity_id:
      - dehumidifier.lab_dehum
    data:
      Mode: dehumidifying
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - variables:
          h: '{{ states(''sensor.lab_humid_humidity'') }}'
      - if:
        - condition: template
          value_template: '{{ (h < 50) }}'
        then:
        - action: dehumidifier.turn_off
          target:
            entity_id:
            - dehumidifier.lab_dehum
      - wait_for_trigger:
        - trigger: time_pattern
          hours: /1
