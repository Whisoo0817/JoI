kind: script
key: C06_003
script:
  alias: C06_003
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.living_room_temp_sensor_temperature'')|float <=
        18 or states(''sensor.bedroom_temp_sensor_temperature'')|float <= 18) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_heater
