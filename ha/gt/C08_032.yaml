kind: automation
key: C08_032
automation:
  alias: C08_032
  mode: single
  triggers:
  - trigger: template
    value_template: '{{ (is_state(''binary_sensor.contact_sensor_1_contact'', ''off'') or
      is_state(''binary_sensor.contact_sensor_2_contact'', ''off'')) }}'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.hall_light_1
      - light.hall_light_2
      - light.lr_light_1
      - light.lr_light_2
