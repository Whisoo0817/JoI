kind: script
key: C12_001
script:
  alias: C12_001
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.entrance_contact_sensor_contact'', ''off'')
      or is_state(''binary_sensor.garage_contact_sensor_contact'', ''off'')) }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: media_player.speak
        target:
          entity_id:
          - media_player.living_speaker
          - media_player.bedroom_speaker
        data:
          Text: Welcome
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /1
