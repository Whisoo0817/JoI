kind: script
key: C03_017
script:
  alias: C03_017
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (is_state(''binary_sensor.house_presence_1_presence'', ''on'') or
        is_state(''binary_sensor.house_presence_2_presence'', ''on'')) }}'
    then:
    - action: siren.set_siren_mode
      target:
        entity_id:
        - siren.main_siren
        - siren.garage_siren
      data:
        Mode: emergency
