kind: script
key: C05_016
script:
  alias: C05_016
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((is_state(''binary_sensor.living_presence_presence'', ''on'') or
        is_state(''binary_sensor.bedroom_presence_presence'', ''on'')) and (is_state(''binary_sensor.kitchen_smoke_smoke'',
        ''on'') or is_state(''binary_sensor.bedroom_smoke_smoke'', ''on''))) }}'
    then:
    - action: siren.set_siren_mode
      target:
        entity_id:
        - siren.main_siren
        - siren.entrance_siren
      data:
        Mode: fire
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_speaker
        - media_player.bedroom_speaker
      data:
        Text: Evacuate
