kind: script
key: C12_005
script:
  alias: C12_005
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.kitchen_smoke_smoke'', ''on'') or is_state(''binary_sensor.bedroom_smoke_smoke'',
      ''on'')) }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: siren.set_siren_mode
        target:
          entity_id:
          - siren.main_siren
          - siren.entrance_siren
        data:
          Mode: emergency
      - delay:
          seconds: 5
      - action: siren.turn_off
        target:
          entity_id:
          - siren.main_siren
          - siren.entrance_siren
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /1
