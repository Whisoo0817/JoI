kind: script
key: C11_002
script:
  alias: C11_002
  mode: single
  sequence:
  - variables:
      t1: '{{ states(''sensor.living_room_temp_sensor_temperature'') }}'
  - delay:
      hours: 1
  - variables:
      t2: '{{ states(''sensor.living_room_temp_sensor_temperature'') }}'
  - if:
    - condition: template
      value_template: '{{ ((t1 - t2) >= 2) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_heater
