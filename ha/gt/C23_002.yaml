kind: script
key: C23_002
script:
  alias: C23_002
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.porch_contact_sensor_contact'', ''off'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.porch_contact_sensor_contact'',
            ''off'')) }}'
        timeout:
          minutes: 1
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.porch_light
  - delay:
      minutes: 3
  - action: switch.turn_off
    target:
      entity_id:
      - switch.porch_light
