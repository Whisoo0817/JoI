kind: script
key: C01_018
script:
  alias: C01_018
  mode: single
  sequence:
  - action: menu_provider.get_menu
    target:
      entity_id:
      - menu_provider.system_menu_provider
    data:
      Command: 오늘 301동식당 점심
    response_variable: GetMenu
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: '{{ GetMenu }}'
