kind: script
key: C03_014
script:
  alias: C03_014
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.living_room_shade_current_position'')|float <= 30
        }}'
    then:
    - action: cover.set_cover_position
      target:
        entity_id:
        - cover.living_room_shade
      data:
        Level: 50
