kind: script
key: C01_016
script:
  alias: C01_016
  mode: single
  sequence:
  - variables:
      Power: '{{ states(''sensor.living_room_charger_power'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The charger's power consumption is {{ Power }}
