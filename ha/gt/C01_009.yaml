kind: script
key: C01_009
script:
  alias: C01_009
  mode: single
  sequence:
  - variables:
      TemperatureWeather: '{{ states(''sensor.system_weather_provider_temperature_weather'')
        }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The outdoor temperature is {{ TemperatureWeather }}
