kind: script
key: C01_014
script:
  alias: C01_014
  mode: single
  sequence:
  - variables:
      Pm10Weather: '{{ states(''sensor.system_weather_provider_pm10_weather'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The outdoor fine dust level is {{ Pm10Weather }}
