kind: script
key: C20_002
script:
  alias: C20_002
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.front_contact_sensor_contact_sensor_contact'',
          ''off'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.front_contact_sensor_contact_sensor_contact'',
            ''off'')) }}'
        timeout:
          seconds: 5
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.entrance_fan
