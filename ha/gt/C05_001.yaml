kind: script
key: C05_001
script:
  alias: C05_001
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (is_state(''binary_sensor.living_room_presence_presence'', ''on'')
        and is_state(''binary_sensor.kitchen_smoke_smoke'', ''on'')) }}'
    then:
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_room_speaker
      data:
        Text: Smoke has been detected in the kitchen
    - action: valve.close_valve
      target:
        entity_id:
        - valve.kitchen_valve
