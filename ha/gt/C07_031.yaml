kind: script
key: C07_031
script:
  alias: C07_031
  mode: single
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.sr_temp_temperature
      above: 35
    then:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.sr_ac
      data:
        Mode: cool
    - action: climate.set_target_temperature
      target:
        entity_id:
        - climate.sr_ac
      data:
        Temperature: 18
