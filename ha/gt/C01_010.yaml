kind: script
key: C01_010
script:
  alias: C01_010
  mode: single
  sequence:
  - variables:
      Humidity: '{{ states(''sensor.living_room_humidity_humidity'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The current humidity is {{ Humidity }}
