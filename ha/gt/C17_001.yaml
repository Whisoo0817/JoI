kind: automation
key: C17_001
automation:
  alias: C17_001
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /10
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.living_room_temp_temperature'')|float >= 30 }}'
    then:
    - action: climate.set_air_conditioner_mode
      target:
        entity_id:
        - climate.living_room_ac
        - climate.bedroom_ac
      data:
        Mode: cool
