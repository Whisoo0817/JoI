kind: script
key: C01_012
script:
  alias: C01_012
  mode: single
  sequence:
  - variables:
      Weather: '{{ states(''sensor.system_weather_provider_weather'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: Today's weather is {{ Weather }}
