kind: script
key: C05_026
script:
  alias: C05_026
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.wine_cellar_temp_temperature'')|float >= 15 and
        states(''sensor.wine_cellar_hum_humidity'')|float >= 60) }}'
    then:
    - action: climate.turn_on
      target:
        entity_id:
        - climate.ac
    - action: humidifier.turn_off
      target:
        entity_id:
        - humidifier.wine_cellar_humidifier
