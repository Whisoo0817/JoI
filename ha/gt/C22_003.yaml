kind: automation
key: C22_003
automation:
  alias: C22_003
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: numeric_state
    entity_id: counter.c22_003_n
    below: 3
  actions:
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.bedroom_speaker
    data:
      Text: lunch time
  - action: counter.increment
    target:
      entity_id: counter.c22_003_n
helpers:
  counter:
    c22_003_n:
      initial: 0
