kind: script
key: C10_009
script:
  alias: C10_009
  mode: single
  sequence:
  - wait_template: '{{ (states(''sensor.dc_temp_1_temperature'')|float >= 30 or states(''sensor.dc_temp_2_temperature'')|float
      >= 30) }}'
  - delay:
      minutes: 1
  - action: climate.set_air_conditioner_mode
    target:
      entity_id:
      - climate.dc_ac_1
      - climate.dc_ac_2
    data:
      Mode: cool
