kind: script
key: C01_011
script:
  alias: C01_011
  mode: single
  sequence:
  - variables:
      HumidityWeather: '{{ states(''sensor.system_weather_provider_humidity_weather'') }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: The outdoor humidity is {{ HumidityWeather }}
