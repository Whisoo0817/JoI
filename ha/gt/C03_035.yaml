kind: script
key: C03_035
script:
  alias: C03_035
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.bedroom_contact_sensor_contact
      state: 'off'
    then:
    - action: switch.turn_off
      target:
        entity_id:
        - switch.bedroom_air_purifier
    else:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.bedroom_air_purifier
