kind: script
key: C03_002
script:
  alias: C03_002
  mode: single
  sequence:
  - action: cloud_service_provider.is_available
    target:
      entity_id:
      - cloud_service_provider.main_cloud_service_provider
      - cloud_service_provider.backup_cloud_service_provider
    response_variable: IsAvailable
  - if:
    - condition: template
      value_template: '{{ (IsAvailable == true) }}'
    then:
    - action: cloud_service_provider.upload_file
      target:
        entity_id:
        - cloud_service_provider.main_cloud_service_provider
        - cloud_service_provider.backup_cloud_service_provider
      data:
        File: test.png
