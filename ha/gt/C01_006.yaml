kind: script
key: C01_006
script:
  alias: C01_006
  mode: single
  sequence:
  - action: media_player.play_media
    target:
      entity_id:
      - media_player.living_room_tv
    data:
      Channel: '{{ states(''sensor.living_room_tv_channel'') }} - 1'
    response_variable: Television.Channel
