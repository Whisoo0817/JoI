kind: script
key: C20_003
script:
  alias: C20_003
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.living_room_presence_sensor_presence'',
          ''on'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.living_room_presence_sensor_presence'',
            ''on'')) }}'
        timeout:
          seconds: 30
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.living_room_tv
