kind: script
key: C07_019
script:
  alias: C07_019
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.baby_room_sound_sensor_sound'')|float > 40 }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
    data:
      Text: Noise detected in the baby room
