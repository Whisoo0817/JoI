kind: script
key: C20_010
script:
  alias: C20_010
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.garage_contact_sensor_contact'', ''off'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.garage_contact_sensor_contact'',
            ''off'')) }}'
        timeout:
          seconds: 30
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_on
    target:
      entity_id:
      - switch.garage_light
