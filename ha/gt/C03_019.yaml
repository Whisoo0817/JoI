kind: script
key: C03_019
script:
  alias: C03_019
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: sensor.home_weather_provider_weather
      state: rain
    then:
    - action: dehumidifier.set_dehumidifier_mode
      target:
        entity_id:
        - dehumidifier.house_dehum_1
        - dehumidifier.house_dehum_2
      data:
        Mode: drying
