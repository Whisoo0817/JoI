kind: script
key: C05_018
script:
  alias: C05_018
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((is_state(''binary_sensor.entrance_motion_motion'', ''off'') and
        is_state(''binary_sensor.garage_motion_motion'', ''off'')) and (is_state(''binary_sensor.living_contact_sensor_contact'',
        ''off'') or is_state(''binary_sensor.bedroom_contact_sensor_contact'', ''off'')))
        }}'
    then:
    - action: camera.capture_image
      target:
        entity_id:
        - camera.entrance_camera
        - camera.garage_camera
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_speaker
        - media_player.bedroom_speaker
      data:
        Text: Warning
