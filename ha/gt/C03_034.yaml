kind: script
key: C03_034
script:
  alias: C03_034
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.living_room_presence_sensor_presence
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.living_room_light
    else:
    - action: light.turn_off
      target:
        entity_id:
        - light.living_room_light
