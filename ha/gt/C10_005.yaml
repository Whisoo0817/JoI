kind: script
key: C10_005
script:
  alias: C10_005
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.house_presence_1_presence'', ''on'') or is_state(''binary_sensor.house_presence_2_presence'',
      ''on'')) }}'
  - delay:
      seconds: 10
  - action: siren.set_siren_mode
    target:
      entity_id:
      - siren.main_siren
      - siren.sub_siren
      - siren.garden_siren
    data:
      Mode: emergency
