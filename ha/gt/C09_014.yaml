kind: script
key: C09_014
script:
  alias: C09_014
  mode: single
  sequence:
  - action: lock.lock
    target:
      entity_id:
      - lock.warehouse_lock_1
      - lock.warehouse_lock_2
  - delay:
      minutes: 1
  - action: siren.set_siren_mode
    target:
      entity_id:
      - siren.warehouse_siren
    data:
      Mode: emergency
