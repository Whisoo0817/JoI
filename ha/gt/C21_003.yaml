kind: script
key: C21_003
script:
  alias: C21_003
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (is_state(''binary_sensor.living_room_motion_sensor_motion'', ''on'')
        or is_state(''binary_sensor.bedroom_motion_sensor_motion'', ''on'')) }}'
    then:
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_room_speaker
      data:
        Text: Motion detected in the living room or bedroom.
