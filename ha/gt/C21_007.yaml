kind: script
key: C21_007
script:
  alias: C21_007
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ (states(''sensor.living_room_temp_sensor_temperature'')|float >=
        30 or states(''sensor.bedroom_temp_sensor_temperature'')|float >= 30) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_ac
