kind: script
key: C20_013
script:
  alias: C20_013
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.bathroom_motion_motion'', ''off'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.bathroom_motion_motion'', ''off''))
            }}'
        timeout:
          seconds: 20
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.bathroom_fan
