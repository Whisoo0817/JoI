kind: script
key: C05_009
script:
  alias: C05_009
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ ((states(''sensor.living_aq_fine_dust_level'')|float >= 150 or states(''sensor.bedroom_aq_fine_dust_level'')|float
        >= 150) and states(''sensor.living_door_lock_door_lock_state'') == ''open'') }}'
    then:
    - action: lock.lock
      target:
        entity_id:
        - lock.living_door_lock
    - action: fan.set_air_purifier_mode
      target:
        entity_id:
        - fan.living_ap
        - fan.bedroom_ap
      data:
        Mode: high
