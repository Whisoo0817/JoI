kind: automation
key: C14_002
automation:
  alias: C14_002
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.hall_mb_button2
    to: pushed
  conditions: []
  actions:
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.hall_light
    data:
      Brightness: max({{ states('sensor.hall_light_current_brightness') }} - 10, 0)
      Rate: 0
