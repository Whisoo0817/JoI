kind: automation
key: C19_002
automation:
  alias: C19_002
  mode: single
  triggers:
  - trigger: time_pattern
    seconds: /1
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.living_room_humidity_sensor_humidity'')|float >=
        70 }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.living_room_dehumidifier
    else:
    - if:
      - condition: template
        value_template: '{{ states(''sensor.living_room_humidity_sensor_humidity'')|float
          <= 50 }}'
      then:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.living_room_dehumidifier
