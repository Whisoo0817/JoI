kind: script
key: C23_003
script:
  alias: C23_003
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.study_presence_presence'', ''off'') }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.study_presence_presence'', ''off''))
            }}'
        timeout:
          minutes: 15
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.study_light
    data:
      Brightness: 20
      Rate: 0
  - delay:
      minutes: 10
  - action: light.turn_off
    target:
      entity_id:
      - light.study_light
