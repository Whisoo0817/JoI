kind: script
key: C12_007
script:
  alias: C12_007
  mode: single
  sequence:
  - wait_template: '{{ (is_state(''binary_sensor.kitchen_smoke_smoke'', ''on'') or is_state(''binary_sensor.bedroom_smoke_smoke'',
      ''on'')) }}'
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_speaker
      - media_player.bedroom_speaker
    data:
      Text: Smoke detected.
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: email_provider.send_mail
        target:
          entity_id:
          - email_provider.email_provider
        data:
          ToAddress: test@example.com
          Title: Fire Warning
          Body: A fire has occurred. Please evacuate.
      - wait_for_trigger:
        - trigger: time_pattern
          minutes: /5
