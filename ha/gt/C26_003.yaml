kind: script
key: C26_003
script:
  alias: C26_003
  mode: single
  sequence:
  - wait_template: '{{ states(''sensor.living_rvc_robot_vacuum_cleaner_operating_state'')
      == ''running'' }}'
  - wait_template: '{{ states(''sensor.living_rvc_robot_vacuum_cleaner_operating_state'')
      == ''docked'' }}'
    timeout:
      hours: 2
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ not wait.completed }}'
    then:
    - action: media_player.speak
      target:
        entity_id:
        - media_player.living_speaker
      data:
        Text: The robot vacuum cleaner is stuck
    - stop: timeout
