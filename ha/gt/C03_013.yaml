kind: script
key: C03_013
script:
  alias: C03_013
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.entrance_face_recognizer_switch
      state: 'off'
    then:
    - action: face_recognizer.start
      target:
        entity_id:
        - face_recognizer.entrance_face_recognizer
