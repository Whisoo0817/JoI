kind: script
key: C09_015
script:
  alias: C09_015
  mode: single
  sequence:
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.kitchen_light
    data:
      Brightness: 100
      Rate: 0
  - delay:
      seconds: 10
  - action: dehumidifier.set_dehumidifier_mode
    target:
      entity_id:
      - dehumidifier.kitchen_dehumidifier
    data:
      Mode: dehumidifying
