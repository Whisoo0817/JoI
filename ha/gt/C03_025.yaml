kind: script
key: C03_025
script:
  alias: C03_025
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.s1_temp_temperature'')|float >= 30 }}'
    then:
    - action: climate.set_target_temperature
      target:
        entity_id:
        - climate.s1_ac
      data:
        Temperature: 22
