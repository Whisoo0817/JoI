kind: automation
key: C07_024
automation:
  alias: C07_024
  mode: single
  triggers:
  - trigger: template
    value_template: '{{ (is_state(''binary_sensor.hallway_presence_sensor_1_presence'', ''on'')
      or is_state(''binary_sensor.hallway_presence_sensor_2_presence'', ''on'')) }}'
  conditions: []
  actions:
  - action: light.set_color
    target:
      entity_id:
      - light.hallway_light_1
      - light.hallway_light_2
    data:
      Color: purple
