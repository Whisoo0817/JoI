kind: script
key: C06_004
script:
  alias: C06_004
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.bedroom_light_sensor_brightness'')|float <= 100
        }}'
    then:
    - action: light.move_to_brightness
      target:
        entity_id:
        - light.bedroom_light
      data:
        Brightness: 100
        Rate: 0
    else:
    - if:
      - condition: template
        value_template: '{{ states(''sensor.bedroom_light_sensor_brightness'')|float <= 300
          }}'
      then:
      - action: light.move_to_brightness
        target:
          entity_id:
          - light.bedroom_light
        data:
          Brightness: 50
          Rate: 0
      else:
      - action: light.move_to_brightness
        target:
          entity_id:
          - light.bedroom_light
        data:
          Brightness: 20
          Rate: 0
