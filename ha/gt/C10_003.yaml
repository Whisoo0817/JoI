kind: script
key: C10_003
script:
  alias: C10_003
  mode: single
  sequence:
  - wait_template: '{{ (states(''sensor.living_room_humidity_sensor_humidity'')|float < 30
      or states(''sensor.bedroom_humidity_sensor_humidity'')|float < 30) }}'
  - delay:
      seconds: 3
  - action: media_player.speak
    target:
      entity_id:
      - media_player.living_room_speaker
      - media_player.kitchen_speaker
    data:
      Text: Humidity is low
