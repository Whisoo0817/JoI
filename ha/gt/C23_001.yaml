kind: script
key: C23_001
script:
  alias: C23_001
  mode: single
  sequence:
  - repeat:
      sequence:
      - wait_template: '{{ is_state(''binary_sensor.living_room_motion_motion'', ''off'')
          }}'
      - wait_for_trigger:
        - trigger: template
          value_template: '{{ not (is_state(''binary_sensor.living_room_motion_motion'', ''off''))
            }}'
        timeout:
          minutes: 10
        continue_on_timeout: true
      until: '{{ wait.trigger is none }}'
  - action: light.move_to_brightness
    target:
      entity_id:
      - light.living_room_light
    data:
      Brightness: 30
      Rate: 0
  - delay:
      minutes: 5
  - action: light.turn_off
    target:
      entity_id:
      - light.living_room_light
