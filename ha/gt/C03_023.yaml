kind: script
key: C03_023
script:
  alias: C03_023
  mode: single
  sequence:
  - if:
    - condition: template
      value_template: '{{ states(''sensor.bedroom_temp_temperature'')|float >= 36.5 }}'
    then:
    - action: climate.set_target_temperature
      target:
        entity_id:
        - climate.bedroom_ac
      data:
        Temperature: 30
